<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>愛的大富翁 Firebase版</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>:root{--p:#e91e63;--s:#fff0f6;--i:#4b2634}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:linear-gradient(145deg,#fff8fb,#ffe2ed);color:var(--i)}main{max-width:1200px;margin:auto;padding:14px}h1{text-align:center;color:var(--p)}.panel{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 20px #9b486522}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,input,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid #e8bfd0}button{background:var(--p);color:#fff;border:0;font-weight:700;cursor:pointer}button.alt{background:#fff;color:var(--p);border:1px solid var(--p)}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap}input,textarea{width:100%}textarea{min-height:120px}.hidden{display:none!important}.status,.event{background:var(--s);padding:12px;border-radius:10px;margin:10px 0}.board{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:6px;overflow:auto}.cell{min-height:82px;border:2px solid #f4cad9;border-radius:10px;padding:7px}.cell b{color:var(--p)}.token{display:block;background:var(--p);color:#fff;border-radius:11px;padding:3px 6px;margin-top:3px;font-size:12px}.guest{max-width:500px;margin:20px auto;text-align:center}.guest button{width:100%;font-size:20px}.big{font-size:30px;font-weight:900;color:var(--p)}#qrcode{display:flex;justify-content:center}.team{padding:8px;border-bottom:1px solid #f2d5df}.warn{color:#a33030;font-weight:700}@media(max-width:800px){.cols,.two{grid-template-columns:1fr}.board{grid-template-columns:repeat(6,100px)}}</style></head><body><main><h1>❤️ 愛的大富翁 Firebase 版 ❤️</h1>
<section id="setup" class="panel"><h2>選擇模式</h2><div class="actions"><button onclick="startHost()">🎤 主持人建立房間</button><button class="alt" onclick="showGuest()">📱 隊伍加入</button></div><div id="initStatus" class="status">正在連線 Firebase…</div></section>
<section id="host" class="hidden"><div class="cols"><div class="panel"><h3>📱 掃描加入</h3><div id="qrcode"></div><p id="roomText"></p><button class="alt" onclick="copyLink()">複製加入連結</button></div><div class="panel"><h3>🎛️ 主持台</h3><b id="roundText"></b><div id="turnText" class="status"></div><div class="actions"><button onclick="nextTurn()">下一隊</button><button class="alt" onclick="newRound()">開新一輪</button><button onclick="resetGame()">重設</button></div></div><div class="panel"><h3>🏆 排行榜</h3><ol id="rank"></ol></div></div>
<div class="panel"><h3>🃏 卡片設定</h3><div class="two"><label>機會卡，每行一則<textarea id="chance"></textarea></label><label>命運卡，每行一則<textarea id="fate"></textarea></label></div><button onclick="saveCards()">儲存設定</button></div><div class="panel"><h3>🎲 最新結果</h3><div id="result" class="event">尚未擲骰</div></div><div class="panel"><h3>🗺️ 棋盤</h3><div id="board" class="board"></div></div><div class="panel"><h3>👥 隊伍</h3><div id="teams"></div></div></section>
<section id="guest" class="hidden"><div class="panel guest"><h2>📱 隊伍加入</h2><div id="guestStatus" class="status"></div><input id="roomInput" placeholder="6位房間代碼"><br><br><input id="nameInput" maxlength="20" placeholder="隊伍名稱"><button onclick="joinRoom()">加入遊戲</button></div><div id="play" class="panel guest hidden"><h2 id="myName"></h2><div id="myTurn" class="status"></div><div id="myPos" class="big"></div><button id="roll" onclick="askRoll()" disabled>🎲 擲骰子</button><div id="myResult" class="event"></div></div></section></main>
<script>
// 重要：請把 Firebase 控制台提供的 firebaseConfig 完整改貼到下方。
const firebaseConfig={apiKey:"AIzaSyBOVSA3IBSzlj0okiKyT2JHJxY1Cr03LUQ",authDomain:"lovemonopoly-73c85.firebaseapp.com",databaseURL:"https://lovemonopoly-73c85-default-rtdb.firebaseio.com",projectId:"lovemonopoly-73c85",storageBucket:"lovemonopoly-73c85.firebasestorage.app",messagingSenderId:"607756354937",appId:"1:607756354937:web:e0fb48cefde52cf06fdba8"};
const TOTAL=36,STEPS=[1,2,3,4,5,6],defaults={chance:['自拍合照','稱讚對方 3 句','牽手 30 秒','分享最感謝的事'],fate:['彼此祝福','分享未來夢想','眼神對望 15 秒','愛的告白']};
let db,uid,roomId,roomRef,state,myTeamId,hostMode=false,processing=false;
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rand=a=>a[Math.floor(Math.random()*a.length)];
function only(id){['setup','host','guest'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}function makeBoard(){if(!$('board'))return;$('board').innerHTML='';for(let i=1;i<=TOTAL;i++)$('board').innerHTML+=`<div class="cell" id="c${i}"><b>${i}${i===TOTAL?' 🏆':''}</b><div></div></div>`}
async function init(){try{if(firebaseConfig.apiKey.startsWith('請貼上'))throw Error('尚未填入 Firebase 設定');firebase.initializeApp(firebaseConfig);db=firebase.database();let c=await firebase.auth().signInAnonymously();uid=c.user.uid;$('initStatus').innerHTML='✅ Firebase 已連線';let q=new URLSearchParams(location.search).get('room');if(q){$('roomInput').value=q;showGuest()}}catch(e){$('initStatus').innerHTML='<span class="warn">Firebase 初始化失敗：'+esc(e.message)+'</span>'}}
async function startHost(){if(!db)return alert('請先完成 Firebase 設定');hostMode=true;roomId=code();roomRef=db.ref('rooms/'+roomId);state={hostUid:uid,round:1,turnIndex:0,cards:defaults,teams:{},lastResult:'尚未擲骰',createdAt:firebase.database.ServerValue.TIMESTAMP};await roomRef.set(state);listen();only('host');makeBoard();let url=location.href.split('?')[0]+'?room='+roomId;new QRCode($('qrcode'),{text:url,width:200,height:200});$('roomText').textContent='房間代碼：'+roomId;history.replaceState(null,'',url)}
function showGuest(){only('guest');$('guestStatus').textContent='請輸入房間代碼與隊伍名稱';let q=new URLSearchParams(location.search).get('room');if(q)$('roomInput').value=q}
function listen(){roomRef.on('value',snap=>{state=snap.val();if(!state)return;if(hostMode){renderHost();processRequests()}else renderGuest()})}
async function joinRoom(){if(!db)return alert('請先完成 Firebase 設定');roomId=$('roomInput').value.trim().toUpperCase();let name=$('nameInput').value.trim();if(!roomId||!name)return;$('guestStatus').textContent='正在加入…';roomRef=db.ref('rooms/'+roomId);let snap=await roomRef.once('value');if(!snap.exists())return $('guestStatus').textContent='找不到房間，請確認代碼';let teams=snap.val().teams||{};if(Object.values(teams).some(t=>t.name===name))return $('guestStatus').textContent='隊伍名稱已被使用';myTeamId=uid;await roomRef.child('teams/'+myTeamId).set({name,pos:0,score:0,finished:false,lastRound:0,rollRequest:0,lastResult:'等待遊戲開始'});listen();$('play').classList.remove('hidden');$('guestStatus').textContent='✅ 已加入房間'}
async function askRoll(){if(!state)return;let me=state.teams?.[myTeamId];if(!me||me.finished||me.lastRound>=state.round)return;$('roll').disabled=true;await roomRef.child('teams/'+myTeamId+'/rollRequest').set(Date.now())}
async function processRequests(){if(processing||!state?.teams)return;let arr=Object.entries(state.teams);let cur=arr[state.turnIndex];if(!cur)return;let [id,t]=cur;if(t.rollRequest&&t.lastRound<state.round&&!t.finished){processing=true;let step=rand(STEPS),old=t.pos||0,pos=Math.max(0,Math.min(TOTAL,old+step)),kind=pos%2===0?'機會':'命運',task=rand(state.cards?.[kind==='機會'?'chance':'fate']||defaults.chance),finished=pos>=TOTAL,text=`${t.name}：${step>0?'+':''}${step} 步，第 ${old} 格到第 ${pos} 格｜${kind}卡：${task}${finished?'｜🏆 抵達終點':''}`;await roomRef.child('teams/'+id).update({pos,score:(t.score||0)+(step>0?step:0),finished,lastRound:state.round,rollRequest:0,lastResult:text});await roomRef.update({lastResult:text});processing=false;setTimeout(nextTurn,600)}}
async function nextTurn(){if(!state?.teams)return;let a=Object.values(state.teams),i=state.turnIndex||0,r=state.round||1;if(!a.length)return;let tries=0;do{i++;if(i>=a.length){i=0;r++}tries++}while(a[i]?.finished&&tries<=a.length);await roomRef.update({turnIndex:i,round:r})}async function newRound(){await roomRef.update({round:(state.round||1)+1,turnIndex:0})}async function resetGame(){let up={round:1,turnIndex:0,lastResult:'遊戲已重設'};Object.keys(state.teams||{}).forEach(id=>{up['teams/'+id+'/pos']=0;up['teams/'+id+'/score']=0;up['teams/'+id+'/finished']=false;up['teams/'+id+'/lastRound']=0;up['teams/'+id+'/rollRequest']=0});await roomRef.update(up)}
async function saveCards(){let cards={chance:$('chance').value.split('\n').map(x=>x.trim()).filter(Boolean),fate:$('fate').value.split('\n').map(x=>x.trim()).filter(Boolean)};await roomRef.child('cards').set(cards)}function copyLink(){navigator.clipboard.writeText(location.href)}
function renderHost(){let entries=Object.entries(state.teams||{}),cur=entries[state.turnIndex];$('roundText').textContent='第 '+state.round+' 輪';$('turnText').innerHTML=cur?'輪到：<b>'+esc(cur[1].name)+'</b>':'等待隊伍加入';$('chance').value=(state.cards?.chance||[]).join('\n');$('fate').value=(state.cards?.fate||[]).join('\n');$('result').textContent=state.lastResult||'';$('teams').innerHTML=entries.map(([id,t],i)=>`<div class="team">${i===state.turnIndex?'👉 ':''}${esc(t.name)}｜第 ${t.pos||0} 格${t.finished?'｜完成':''}</div>`).join('')||'尚無隊伍';$('rank').innerHTML=entries.map(x=>x[1]).sort((a,b)=>(b.pos||0)-(a.pos||0)||(b.score||0)-(a.score||0)).map(t=>`<li>${esc(t.name)}｜第 ${t.pos||0} 格｜${t.score||0} 分</li>`).join('');document.querySelectorAll('.cell>div').forEach(x=>x.innerHTML='');entries.forEach(([id,t])=>{if(t.pos>0&&$('c'+t.pos))$('c'+t.pos).lastChild.innerHTML+=`<span class="token">${esc(t.name)}</span>`})}
function renderGuest(){let me=state.teams?.[myTeamId];if(!me)return;let arr=Object.entries(state.teams||{}),cur=arr[state.turnIndex],can=cur?.[0]===myTeamId&&!me.finished&&me.lastRound<state.round;$('myName').textContent='❤️ '+me.name;$('myPos').textContent='第 '+(me.pos||0)+' 格';$('myTurn').textContent=me.finished?'🏆 已抵達終點':can?'第 '+state.round+' 輪，輪到您了！':'等待 '+(cur?.[1]?.name||'主持人');$('roll').disabled=!can;$('myResult').textContent=me.lastResult||''}
init();</script></body></html>
